# Development docker-compose — full-stack local setup
# Usage: cp .env.example .env && <fill in API keys> && docker compose up
#
# By default, starts PostgreSQL and Redis in Docker (COMPOSE_PROFILES=infra in .env).
# To use an external database/Redis, remove COMPOSE_PROFILES from .env and set
# DB_HOST, REDIS_URL to your own instances.

services:
  postgres:
    profiles: ["infra"]
    image: postgres:18
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    volumes:
      - langalpha-postgresql-data:/var/lib/postgresql
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    profiles: ["infra"]
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - langalpha-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dev
      args:
        INSTALL_OBSERVABILITY: ${INSTALL_OBSERVABILITY:-${OTEL_EXPORTER_OTLP_ENDPOINT:+true}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    pids_limit: 8192
    mem_limit: 8g
    memswap_limit: 8g
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file: .env
    environment:
      BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:-langalpha-local-dev-encryption-key}
      # Default to Docker service names for inter-container networking.
      # Override in .env to connect to external services or for host dev.
      DB_HOST: ${DB_HOST:-postgres}
      REDIS_URL: "${REDIS_URL:-redis://:${REDIS_PASSWORD:-redis}@redis:6379/0}"
      # The web app is served from its own port here, and /a/<code> links the
      # agent writes into a reply must open there, not on the API port.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:${FRONTEND_PORT:-5173}}
    volumes:
      # Mount source for hot-reload
      - ./src:/app/src
      - ./libs/market-protocol:/app/libs/market-protocol
      - ./server.py:/app/server.py
      - ./agent_config.yaml:/app/agent_config.yaml
      # Required when SANDBOX_PROVIDER=docker and the backend auto-builds
      # langalpha-sandbox:latest on first workspace creation.
      - ./Dockerfile.sandbox:/app/Dockerfile.sandbox:ro
      # Docker socket — only needed when SANDBOX_PROVIDER=docker (DooD pattern).
      # Safe to remove if using only the Daytona provider.
      - ${DOCKER_HOST_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ./config.yaml:/app/config.yaml
      - ./mcp_servers:/app/mcp_servers
      - ./plugins:/app/plugins
      - ./scripts:/app/scripts
      - ./alembic.ini:/app/alembic.ini
      - ./migrations:/app/migrations
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # SSH tunnel gateway: lets a machine the server cannot dial (a home Mac behind
  # a router, an office box behind NAT) connect out with `ssh -N -R ...` and be
  # reached through this service. It only relays bytes; the SSH login stays end
  # to end with the machine's own sshd. Exactly one instance per deployment (it
  # holds the tunnels in memory); restarting it drops them for a few seconds and
  # machines reconnect by themselves. Off by default. To turn it on:
  #   docker compose --profile ssh-gateway up -d ssh-gateway
  # and in .env set SSH_GATEWAY_ADDRESS=ssh-gateway:2023 for the backend, plus
  # SSH_GATEWAY_PUBLIC_ADDRESS=<host>:<port> where machines reach it (raw TCP).
  # Port 2023 takes only the backend's login and is never published, so the
  # gateway's dialer key is no use from outside this network.
  ssh-gateway:
    profiles: ["ssh-gateway"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.dev
      args:
        INSTALL_OBSERVABILITY: ${INSTALL_OBSERVABILITY:-${OTEL_EXPORTER_OTLP_ENDPOINT:+true}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    ports:
      - "${SSH_GATEWAY_PORT:-2022}:2022"
    env_file: .env
    environment:
      BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:-langalpha-local-dev-encryption-key}
      DB_HOST: ${DB_HOST:-postgres}
      # The container port is fixed, published as SSH_GATEWAY_PORT above; a
      # SSH_GATEWAY_LISTEN in .env, meant for a native run, cannot move it.
      SSH_GATEWAY_LISTEN: 0.0.0.0:2022
      SSH_GATEWAY_DIAL_LISTEN: 0.0.0.0:2023
      # One process: a mass disconnect asks for a connection per tunnel at
      # once, which past this waits its turn instead of taking the database's.
      # One connection is held throughout for the gateway's lock.
      POSTGRES_CONVERSATION_POOL_MAX: ${SSH_GATEWAY_DB_POOL_MAX:-15}
    # A file per connected machine.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Anyone may connect on the published port, so what a flood of them can
    # take is bounded here rather than from the rest of the host.
    mem_limit: ${SSH_GATEWAY_MEM_LIMIT:-1g}
    memswap_limit: ${SSH_GATEWAY_MEM_LIMIT:-1g}
    command: ["uv", "run", "python", "-m", "src.server.ssh_gateway"]
    volumes:
      - ./src:/app/src
      - ./libs/market-protocol:/app/libs/market-protocol
      - ./alembic.ini:/app/alembic.ini
      - ./migrations:/app/migrations
    # Wait for the backend so its migrations have run before the gateway reads keys.
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install -g pnpm@12 && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_PROXY_BACKEND: http://backend:8000
    volumes:
      - ./web:/app
      - frontend_node_modules:/app/node_modules
      - frontend_pnpm_store:/app/.pnpm-store

volumes:
  langalpha-postgresql-data:
  langalpha-redis-data:
  frontend_node_modules:
  frontend_pnpm_store:
