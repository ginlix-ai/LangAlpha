name: Desktop Release

# Ships a versioned release of the open-source edition of the desktop app: builds
# it (desktop-build.yml), publishes its update feed and attaches its installers to
# a GitHub release. That release is how a self-hoster gets a build, and the feed
# is how an installed copy learns of the next one. Nightly builds of main ship
# from desktop-nightly.yml into the same feed, on a channel of their own.
#
# Everything a release needs beyond the source comes from the `desktop-release`
# environment, so it reaches only the jobs that name it, and only on the branches
# and with the approvals that environment allows: the build's secrets and the
# feed's address (listed in desktop-build.yml), and
#   secrets  R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT, R2_BUCKET
#                                                 an S3 key that writes the feed
#   vars     HOSTED_DOWNLOAD_PAGE                 optional, linked from the notes
# Each part works without the others. With no certificate the builds are unsigned
# and the notes say how to open them; with no feed they never update themselves
# and the notes say to watch the releases page. A fork sets whichever it has.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (e.g. 0.4.0 or 0.4.0-rc.1). Empty keeps package.json's."
        required: false
        default: ""
      publish:
        description: "Publish the update feed and the GitHub release"
        type: boolean
        default: false
      overwrite:
        description: "Replace a version already in the feed with different bytes"
        type: boolean
        default: false

# Read at the top so the build runners, which install dependencies and run
# electron-builder (the third-party code in this workflow), cannot reach the
# repository or its releases with the checkout's own token. Only the job that
# publishes gets write.
permissions:
  contents: read

jobs:
  # Ahead of the builds, so a release that could never be tagged costs one
  # runner-second rather than four builds.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check a release can be tagged
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$PUBLISH" = true ] && [ -z "$(printf '%s' "$VERSION" | tr -d '[:space:]')" ]; then
            echo "::error::publish needs a version. The tag is desktop-oss-v<version>, so an empty one creates the tag 'desktop-oss-v'."
            exit 1
          fi
          # The nightly channel is desktop-nightly.yml's: a release on it would
          # replace the nightly's manifests without moving the tag the nightly's
          # commit order is checked against.
          version=$(printf '%s' "$VERSION" | tr -d '[:space:]')
          case "$version" in
            *-*) pre=${version#*-}
              if [ "$PUBLISH" = true ] && [ "${pre%%.*}" = nightly ]; then
                echo "::error::'$version' would publish to the nightly channel, which only desktop-nightly.yml publishes to; name its prerelease otherwise, like 0.4.0-rc.1"
                exit 1
              fi ;;
          esac

  build:
    needs: check
    uses: ./.github/workflows/desktop-build.yml
    with:
      version: ${{ inputs.version }}
      environment: desktop-release

  release:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    # The feed's write key, read by nothing else in this workflow.
    environment: desktop-release
    # One publish at a time, nightly included, so two runs cannot interleave
    # their manifests or prune what the other is publishing.
    concurrency:
      group: desktop-oss-feed
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      CHANNEL: ${{ needs.build.outputs.channel }}
      FEED: ${{ vars.DESKTOP_UPDATE_FEED }}
    steps:
      # For desktop/scripts/make-release-index.mjs, which names the platform of
      # each installer for the notes. At the commit the binaries were built from.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A stable version outranks every nightly below it, so an install on the
      # nightly channel that picked Stable takes this build. It must then carry
      # everything the nightly did: an older backend cannot run on a database the
      # nightly has migrated. Checked here, holding the feed, because a nightly
      # can publish while this run waits for approval or builds.
      - name: Check the release is at or past the nightly
        if: needs.build.outputs.channel == 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # Empty only when there never was a nightly; a lookup that fails, or a
          # nightly tag gone while the feed still serves a nightly, stops here.
          nightly=$(bash desktop/scripts/nightly-refs.sh nightly)
          [ -n "$nightly" ] || exit 0
          status=$(gh api "repos/$REPO/compare/$nightly...$SHA" --jq '.status' 2>/dev/null) || status=''
          case "$status" in
            ahead|identical) echo "  at or past the nightly at ${nightly:0:10}" ;;
            *) echo "::error::$SHA is not at or past the nightly at $nightly ($status). Release from a commit that includes it."; exit 1 ;;
          esac

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Write the release notes
        env:
          SIGNED_MAC: ${{ secrets.MAC_CSC_LINK != '' }}
          SIGNED_WIN: ${{ secrets.WIN_CSC_LINK != '' }}
          HOSTED_DOWNLOAD_PAGE: ${{ vars.HOSTED_DOWNLOAD_PAGE }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p index
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} index/ \;
          node desktop/scripts/make-release-index.mjs index "$VERSION"
          node desktop/scripts/release-notes.mjs index "desktop-oss-v${VERSION}" stable > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      # Opened before the feed, as a draft no one else can see, so a release this
      # run cannot create stops it before any installed app is told of a build.
      - name: Open the release as a draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # `desktop-oss-v` so this edition's tags never collide with another
          # build's `desktop-v` ones in the same repository.
          tag="desktop-oss-v${VERSION}"
          # Re-runnable: a publish that failed partway through is retried by
          # running it again, so neither step may error on work already done.
          # `gh release create` refuses an existing tag and `gh release upload`
          # refuses a duplicate asset name, and both would strand a release that
          # had uploaded some of its artifacts.
          # --target pins the tag to the commit these artifacts were built from.
          # Without it a missing tag is created from the default branch's head,
          # so a release cut from an older ref ships binaries that no longer
          # match the source the tag points at.
          # A tag that already exists must still point at the commit these
          # artifacts were built from. `gh release view` succeeding skips the
          # only --target, so a rerun from a different ref would clobber the
          # binaries and leave the tag where it was: source from one tree,
          # executables from another, under one version.
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            # Where the existing release's tag points. Each lookup is cleared when
            # it fails, since a 404 prints its JSON body to stdout, past --jq.
            tagless=false
            if ref=$(gh api "repos/$REPO/git/ref/tags/$tag" \
                --jq '.object.type + " " + .object.sha' 2>"$RUNNER_TEMP/tagref.err"); then
              at=${ref#* }
              # An annotated tag resolves to a tag object, and its SHA is not the
              # commit's. Every signed tag is annotated, so a maintainer who cuts
              # the tag by hand rather than letting the release create it lands
              # here, and an unpeeled comparison rejects a tag sitting exactly
              # where it belongs.
              if [ "${ref%% *}" = tag ]; then
                at=$(gh api "repos/$REPO/git/tags/$at" --jq '.object.sha' 2>/dev/null) || at=''
              fi
            elif grep -q 'HTTP 404' "$RUNNER_TEMP/tagref.err" \
              && [ "$(gh release view "$tag" --repo "$REPO" --json isDraft --jq '.isDraft' 2>/dev/null)" = true ]; then
              # A draft has no tag ref until this run tags it below. That is the
              # state a run that failed after `create` leaves behind, and reruns
              # of it are what --clobber below is for. The draft records the
              # commit it was cut from, which answers the same question. Only
              # here: for a tag that exists, the release's target says nothing
              # about where the tag points.
              tagless=true
              at=$(gh release view "$tag" --repo "$REPO" --json targetCommitish --jq '.targetCommitish' 2>/dev/null) || at=''
            else
              cat "$RUNNER_TEMP/tagref.err"
              at=''
            fi
            # Nothing could say what the release is pinned to. Publishing over it
            # is the mismatch this check exists to prevent, so refuse.
            if [ -z "$at" ]; then
              echo "::error::$tag exists, but where it points could not be read; refusing to clobber it."
              exit 1
            fi
            if [ "$at" != "$SHA" ]; then
              # A draft with no tag was left by a run that stopped before
              # publishing: unseen and pinned to nothing yet, so deleting it is
              # the way to cut it again from here. A release that was public
              # keeps its tag through a redraft, and deleting it would leave that
              # tag behind.
              if [ "$tagless" = true ]; then
                echo "::error::$tag is an unpublished draft cut from $at, not $SHA. Delete the draft (gh release delete $tag) and run again. If that run already put this version's archives in the feed, other bytes under the same names are refused there, so pick a new version instead."
              else
                echo "::error::$tag is on $at, not $SHA. Move the tag deliberately or pick a new version."
              fi
              exit 1
            fi
          else
            gh release create "$tag" --repo "$REPO" \
              --target "$SHA" \
              --title "Desktop v${VERSION} (self-hosted)" \
              --notes-file notes.md \
              --draft
          fi
          # A prerelease version, the way to rehearse this pipeline, is marked so.
          if [ "$VERSION" != "${VERSION%%-*}" ]; then gh release edit "$tag" --repo "$REPO" --prerelease; fi
          # A rerun over a release that is already public leaves it up until the
          # feed has gone through, so a run the feed refuses hides nothing.
          if [ "$(gh release view "$tag" --repo "$REPO" --json isDraft --jq '.isDraft')" = false ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
          # Written once for the two steps below that attach the installers.
          cat > "$RUNNER_TEMP/attach.sh" <<'SH'
          set -euo pipefail
          tag="desktop-oss-v${VERSION}"
          # The installers only. The .zip and its .blockmap are the updater's
          # payload and live in the feed, where installed apps read them; here they
          # would be weight on a page whose readers came for something to open.
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \
            -o -name '*.AppImage' -o -name '*.deb' \) > assets.txt
          # An explicit loop, because `find -exec` reports only find's own
          # errors: an upload that failed left this step green and the release
          # below publishable, which is the one thing the draft was protecting
          # against. An empty match is the same failure arriving earlier.
          if [ ! -s assets.txt ]; then
            echo "::error::no installers matched; refusing to publish an empty release"
            exit 1
          fi
          while IFS= read -r asset; do
            echo "uploading $(basename "$asset")"
            gh release upload "$tag" "$asset" --clobber --repo "$REPO"
          done < assets.txt
          SH

      - name: Attach the installers
        if: steps.draft.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash "$RUNNER_TEMP/attach.sh"

      # A Python of its own: the runner's moves with the image, and a pinned
      # PyYAML stops having a wheel for it the day it does.
      - uses: actions/setup-python@v5
        if: vars.DESKTOP_UPDATE_FEED != ''
        with:
          python-version: '3.13'

      # A step of its own, so the package it installs never runs beside the feed's
      # write key.
      - name: Gather the feed
        if: vars.DESKTOP_UPDATE_FEED != ''
        env:
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          python -m pip install --quiet --only-binary=:all: pyyaml==6.0.3
          python desktop/scripts/feed-gather.py

      # The tag ahead of the manifests, though the release stays a draft until
      # the feed is through: the newest stable tag is what desktop-nightly.yml
      # names its builds above and checks its commit against, so a release that
      # stops after reaching the feed must already count. The draft step above
      # has refused a tag on another commit.
      - name: Tag the release
        if: vars.DESKTOP_UPDATE_FEED != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          tag="desktop-oss-v${VERSION}"
          at=$(bash desktop/scripts/nightly-refs.sh commit "$tag")
          if [ -z "$at" ]; then
            gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" --jq '.ref'
          elif [ "$at" != "$SHA" ]; then
            # A tag left with no release is not one the draft step checks, and
            # creating the draft on it does not move it.
            echo "::error::$tag is on $at, not $SHA. Move the tag deliberately or pick a new version."
            exit 1
          fi

      # Before the release is published, because the manifest is what tells an installed app a
      # build exists: published ahead of the archives it names, every app would
      # offer a download that 404s. The list of files is read out of the
      # manifests, since the updater fetches exactly what they name, so a renamed
      # or added artifact can never leave a manifest pointing at nothing.
      - name: Publish the update feed
        if: vars.DESKTOP_UPDATE_FEED != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: bash desktop/scripts/feed-publish.sh

      # `--clobber` deletes each asset before uploading its replacement, so a
      # failure midway would leave the public page serving a mix of old, new and
      # missing binaries. The release goes back to draft first; its tag stays.
      - name: Replace the installers of the public release
        if: steps.draft.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release edit "desktop-oss-v${VERSION}" --repo "$REPO" --draft=true
          bash "$RUNNER_TEMP/attach.sh"

      # Published once the feed is, so the page and the updater offer the same
      # build. `--notes-file` on a rerun too, since the notes follow this run's
      # signing state. `--latest=false`: the Latest badge answers
      # /releases/latest, and that link belongs to the app most people want, not
      # to a build that asks where its server is.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh release edit "desktop-oss-v${VERSION}" --repo "$REPO" --notes-file notes.md --draft=false --latest=false

      # The manifests reached the way an installed app reaches them.
      - name: Check the feed's manifests from outside
        if: vars.DESKTOP_UPDATE_FEED != ''
        run: bash desktop/scripts/feed-check.sh
