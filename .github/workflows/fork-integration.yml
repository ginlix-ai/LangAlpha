name: Fork Integration Tests

# The Daytona tier for FORK PRs only: the tests sandbox-integration.yml's
# sandbox-daytona job runs for same-repo PRs, which a fork's `pull_request`
# run cannot, having no secrets. The Postgres/Redis tier needs no secrets, so
# fork PRs get it from test.yml's backend-integration like any other PR.
#
# SECURITY: pull_request_target runs in the base-repo context (so DAYTONA_API_KEY
# is available) and this job checks out and executes the fork's UNTRUSTED code.
# `uv sync` builds the root project AND the editable libs/market-protocol from
# fork-controlled source, so fork build hooks (pyproject.toml / hatch hooks /
# uv.lock / conftest.py) auto-run BEFORE pytest, with the key in the env. The
# reviewer MUST audit build config + lockfile + libs/, not just the test files.
# This is only safe because:
#   1. the `fork-ci` environment requires a maintainer to approve each run, and
#      the gate re-fires on every push (synchronize);
#   2. the Daytona key is scoped to Sandboxes Write+Delete, so a leaked key only
#      buys sandbox churn (no data, snapshots, registries, or volumes);
#   3. GITHUB_TOKEN is pinned to contents:read with persist-credentials:false,
#      so fork code cannot escalate to repo write via the checkout token.
#
# Paths: the list in sandbox-integration.yml, with this file for its own.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - src/ptc_agent/core/**
      - src/ptc_agent/config/**
      - src/ptc_agent/agent/backends/**
      - src/ptc_agent/agent/filesystem_routes.py
      - src/ptc_agent/agent/middleware/skills/**
      - src/server/app/computers*.py
      - src/server/app/workspace_files/**
      - src/server/app/workspace_sandbox.py
      - src/server/database/computer.py
      - src/server/database/computer_names.py
      - src/server/database/computer_root.py
      - src/server/database/computer_spec_change.py
      - src/server/database/workspace*.py
      - src/server/handlers/chat/attachments.py
      - src/server/services/computer_manager/**
      - src/server/services/persistence/**
      - src/server/services/platform_secret_rollout.py
      - src/server/services/warm_files.py
      - src/server/services/workspace_file_containment.py
      - src/server/services/workspace_files.py
      - src/server/services/workspace_layout.py
      - src/server/services/workspace_manager.py
      - src/server/utils/multimodal_context.py
      - src/server/utils/secret_redactor.py
      - Dockerfile.sandbox
      - docker-compose.yml
      - libs/market-protocol/**
      - pyproject.toml
      - uv.lock
      - tests/conftest.py
      - tests/computer_manager_patch.py
      - tests/integration/conftest.py
      - tests/integration/sandbox/**
      - tests/integration/test_message_hot_path.py
      - .github/workflows/fork-integration.yml

concurrency:
  group: fork-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The backend image's Python (deploy/Dockerfile.backend). Left unset, uv
# downloads the newest release, which a dependency may not ship wheels for yet.
env:
  UV_PYTHON: "3.13"

jobs:
  sandbox-daytona-fork:
    # Forks only: same-repo PRs run sandbox-integration.yml's sandbox-daytona.
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Required reviewers on this environment are the maintainer-approval gate.
    environment: fork-ci
    # Least privilege: this job only needs to read the repo to check out + test.
    # Without it, pull_request_target inherits the repo default (can be write),
    # handing fork build-hook code a repo-write token via the checkout credential.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: langalpha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: langalpha_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379
      SANDBOX_TEST_PROVIDERS: daytona
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      DAYTONA_BASE_URL: ${{ secrets.DAYTONA_BASE_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Pin to the exact head SHA from the event payload (UNTRUSTED fork
          # code — see the SECURITY note above). This is immutable and equals the
          # commit the fork-ci reviewer approved, so a force-push after approval
          # cannot swap in unreviewed code before checkout (no TOCTOU window).
          # We test the fork commit in isolation; the post-merge push CI on main
          # re-tests the real merged result.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          # Don't write the token into .git/config — fork code that runs during
          # `uv sync`/pytest could otherwise read it back and use it.
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "latest"
      - run: uv sync --group dev --extra test
      # The selection sandbox-integration.yml's sandbox-daytona runs. The fork
      # gets no FMP key, so the Daytona platform-secret test skips.
      - run: uv run pytest tests/integration/ -v --tb=short -m "integration and provider_daytona and not slow" --junitxml=test-results/sandbox-daytona-fork.xml --sandbox-metrics --sandbox-metrics-file test-results/sandbox_metrics_daytona.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sandbox-daytona-fork-results
          path: test-results/
