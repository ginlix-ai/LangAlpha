name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR makes its running checks moot; a push to main keeps each
# run, so every merged commit is tested.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The backend image's Python (deploy/Dockerfile.backend). Left unset, uv
# downloads the newest release, which a dependency may not ship wheels for yet.
env:
  UV_PYTHON: "3.13"

jobs:
  # Which path-scoped jobs a PR needs. A push to main runs every job, and so
  # does a PR whose filter step fails: each job's `if` reads a missing output
  # as "run".
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      bridge: ${{ steps.filter.outputs.bridge }}
      cli: ${{ steps.filter.outputs.cli }}
      market_protocol: ${{ steps.filter.outputs.market_protocol }}
      claude_code_scripts: ${{ steps.filter.outputs.claude_code_scripts }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/test.yml
            web:
              - *workflow
              - web/**
            bridge:
              - *workflow
              - web/**
              - src/server/preview_proxy/bridge/**
              - src/server/preview_proxy/page_bridge.py
              - Makefile
            cli:
              - *workflow
              - cli/**
            market_protocol:
              - *workflow
              - libs/market-protocol/**
            claude_code_scripts:
              - *workflow
              - src/ptc_agent/agent/claude_code/**
              - src/ptc_agent/core/claude_code_managed*
              - src/ptc_agent/core/paths.py
              # The scripts the Mac runs come from these, _ssh_shell and
              # _ssh_bootstrap included.
              - src/ptc_agent/core/sandbox/providers/_ssh_*.py
              - src/ptc_agent/core/sandbox/providers/ssh.py
              - src/llms/claude_code*
              - tests/unit/ptc_agent/agent/claude_code/**
              - pyproject.toml
              - uv.lock

  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      # claude-code: the Claude Code runtime's tests drive its bundled CLI.
      - run: uv sync --group dev --extra test --extra claude-code
      # The Grep tool's tests run rg on the host; without it they skip.
      - run: sudo apt-get install -y ripgrep
      # No -v: under xdist it interleaves four workers' lines. -rfE lists
      # failures and errors at the end, and the JUnit file has every result.
      - run: uv run pytest tests/unit/ -n 4 --dist load -rfE --tb=short --junitxml=test-results/backend-unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-results
          path: test-results/

  # The scripts Claude Code runs on a user's own computer, on a real Mac:
  # BSD tools, bash 3.2, no flock, no sha256sum, no /proc. The Linux job
  # emulates that userland; this one is the real thing.
  claude-code-scripts-macos:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.claude_code_scripts != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv sync --group dev --extra test --extra claude-code
      - run: uv run pytest -v --tb=short -m macos_scripts tests/unit/ptc_agent/agent/claude_code

  # libs/market-protocol installs as a package of its own, so its suite runs in
  # its own environment: inside the backend's, a dependency it forgot to
  # declare would still import. It runs on the package's Python floor and on
  # the backend's version, against an installed copy rather than the checkout,
  # so a file the wheel leaves out fails here instead of in a consumer.
  market-protocol:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.market_protocol != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: libs/market-protocol
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv sync --locked --no-editable
      - run: uv run --locked --no-editable pytest -v --tb=short
      # A consumer resolves its own versions, so the declared lower bounds
      # have to hold as well as the locked set.
      - name: Lowest declared versions
        if: matrix.python == '3.11'
        run: |
          uv venv "$RUNNER_TEMP/floors"
          uv pip install --python "$RUNNER_TEMP/floors" --resolution lowest-direct . "pytest>=8"
          "$RUNNER_TEMP/floors/bin/pytest" -v --tb=short -p no:cacheprovider

  # Everything in tests/integration/ that needs only Postgres and Redis, with
  # the sandbox tests on the in-process memory provider. No secrets, so it
  # runs on fork PRs as well, and in parallel with backend-unit. The same
  # tests on Daytona run in sandbox-integration.yml, only when a change can
  # reach them, and nightly.
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: langalpha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: langalpha_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379
      SANDBOX_TEST_PROVIDERS: memory
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      # claude-code: tests/integration/claude_code drives the bundled CLI on a
      # Docker sshd against a fake Messages API; without the extra they are
      # not collected.
      - run: uv sync --group dev --extra test --extra claude-code
      - run: sudo apt-get install -y ripgrep
      # sandbox/providers holds the Docker and Daytona provider tests, which
      # sandbox-integration.yml owns.
      - run: uv run pytest tests/integration/ -v --tb=short -m "integration and not yahoo" --ignore=tests/integration/sandbox/providers --junitxml=test-results/backend-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-results
          path: test-results/

  # langalpha, the CLI: the same bundle every computer runs and npm ships, on
  # the Node floor the package declares and on the image's Node.
  cli:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.cli != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: cli/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: node scripts/check-package.mjs

  # web/ is a package that installs, type-checks, lints, tests and builds on
  # its own, so this job runs from an export of that directory alone, with the
  # rest of the repo out of reach: a config, source or test that resolves a
  # path outside web/ fails here rather than in a build that copies only web/.
  frontend-unit:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          path: checkout
      - run: git -C checkout archive HEAD web | tar -xf -
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # A commit, not the v6 tag: that tag still points at a release without
      # pnpm 12 support.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Reads the pin from `packageManager`, so CI runs the pnpm the lockfile
          # was written by without a second copy of the version to keep in sync.
          package_json_file: web/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # Errors fail the job; warnings stay advisory.
      - run: pnpm lint
      - run: pnpm vitest run --reporter=verbose
      # Bundle the app to assert what lands on the critical path; typecheck above
      # already covers the tsc half of `pnpm build`, so invoke vite directly.
      #
      # Build the deployed configuration, not the default one. Two knobs change
      # what ships, and both are inlined at build time: VITE_HOST_MODE selects
      # the auth provider, and the Supabase URL/key decide whether the SDK
      # survives tree-shaking at all — `supabase.ts` guards the client behind
      # `url && key`, so unset vars fold that to null and drop ~57 kB gz the
      # real build carries. Placeholders are enough; nothing dials them.
      - run: pnpm exec vite build
        env:
          VITE_HOST_MODE: platform
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      - run: node scripts/check-critical-path.mjs

  # The page bridge the server splices into agent HTML is plain script typed
  # against the viewer's message protocol in web/, and tested on web's Vitest.
  # It borrows web's install from outside; web never reads the bridge.
  preview-bridge:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.bridge != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: make test-bridge

  # The desktop shell is ~2000 lines of URL policy whose whole job is REFUSING
  # things: a blob that is not really our origin, a scheme that is not a browser
  # scheme, a redirect that leaves the app, a config value that is secretly
  # another host. None of that has a runtime here — the suite runs against a
  # stub — and none of it fails a typecheck, a build, or the web suite when it
  # regresses. It just quietly starts allowing what it used to refuse.
  #
  # It needs no services and finishes in well under a second, so it is not
  # conditioned on paths: a `web/index.html` edit can break the window-chrome
  # contract that lives half in this suite, and that is exactly the change that
  # would not have matched a `desktop/**` filter.
  desktop-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # A commit, not the v6 tag: that tag still points at a release without
      # pnpm 12 support.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Reads the pin from `packageManager`, so CI runs the pnpm the lockfile
          # was written by without a second copy of the version to keep in sync.
          package_json_file: desktop/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  frontend-e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    # Bound a hung run instead of riding GitHub's 6h default timeout.
    timeout-minutes: 20
    # Official Playwright image ships the browser + system deps pre-installed,
    # pulled from MCR. This removes the `playwright install` download step,
    # whose post-download hang (Chromium fetch reaches 100% then stalls during
    # extraction / next-artifact fetch from cdn.playwright.dev) was hanging CI.
    # KEEP THIS TAG IN SYNC with the @playwright/test version resolved in
    # web/pnpm-lock.yaml (package.json uses a ^ range, so the lockfile is the
    # source of truth). A mismatch makes playwright test fail on a browser/
    # library version error.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # A commit, not the v6 tag: that tag still points at a release without
      # pnpm 12 support.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Reads the pin from `packageManager`, so CI runs the pnpm the lockfile
          # was written by without a second copy of the version to keep in sync.
          package_json_file: web/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
