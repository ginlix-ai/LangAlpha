name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv sync --group dev --extra test
      - run: uv run pytest tests/unit/ -v --tb=short --junitxml=test-results/backend-unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-results
          path: test-results/

  # libs/market-protocol installs as a package of its own, so its suite runs in
  # its own environment: inside the backend's, a dependency it forgot to
  # declare would still import. It runs on the package's Python floor and on
  # the backend's version, against an installed copy rather than the checkout,
  # so a file the wheel leaves out fails here instead of in a consumer.
  market-protocol:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: libs/market-protocol
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv sync --locked --no-editable
      - run: uv run --locked --no-editable pytest -v --tb=short
      # A consumer resolves its own versions, so the declared lower bounds
      # have to hold as well as the locked set.
      - name: Lowest declared versions
        if: matrix.python == '3.11'
        run: |
          uv venv "$RUNNER_TEMP/floors"
          uv pip install --python "$RUNNER_TEMP/floors" --resolution lowest-direct . "pytest>=8"
          "$RUNNER_TEMP/floors/bin/pytest" -v --tb=short -p no:cacheprovider

  backend-integration:
    runs-on: ubuntu-latest
    needs: backend-unit
    # Same-repo PRs + pushes only. Fork PRs can't read secrets on the
    # `pull_request` event, so they run through fork-integration.yml
    # (pull_request_target, gated by the fork-ci environment reviewers) instead.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    environment: integration
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: langalpha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: langalpha_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379
      SANDBOX_TEST_PROVIDER: daytona
      DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
      DAYTONA_BASE_URL: ${{ secrets.DAYTONA_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv sync --group dev --extra test
      - run: sudo apt-get install -y ripgrep
      # Skip docker-provider sandbox tests; they need GHCR auth + buildx
      # and are owned by the sandbox-integration workflow's docker tier.
      - run: uv run pytest tests/integration/ -v --tb=short -m "integration and not yahoo" --ignore=tests/integration/sandbox/providers --junitxml=test-results/backend-integration.xml --sandbox-metrics --sandbox-metrics-file test-results/session_metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-results
          path: test-results/

  hotpath-comment:
    runs-on: ubuntu-latest
    needs: backend-integration
    if: always() && github.event_name == 'pull_request' && needs.backend-integration.result != 'skipped'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-integration-results
          path: test-results/
      - name: Generate hot path comment
        run: python3 scripts/ci/hotpath_comment.py test-results/backend-integration.xml --metrics test-results/session_metrics.json > comment_body.md
      - name: Post sticky PR comment
        if: hashFiles('comment_body.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: hotpath-metrics
          path: comment_body.md

  frontend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # A commit, not the v6 tag: that tag still points at a release without
      # pnpm 12 support.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Reads the pin from `packageManager`, so CI runs the pnpm the lockfile
          # was written by without a second copy of the version to keep in sync.
          package_json_file: web/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # Errors fail the job; warnings stay advisory.
      - run: pnpm lint
      - run: pnpm vitest run --reporter=verbose
      # Bundle the app to assert what lands on the critical path; typecheck above
      # already covers the tsc half of `pnpm build`, so invoke vite directly.
      #
      # Build the deployed configuration, not the default one. Two knobs change
      # what ships, and both are inlined at build time: VITE_HOST_MODE selects
      # the auth provider, and the Supabase URL/key decide whether the SDK
      # survives tree-shaking at all — `supabase.ts` guards the client behind
      # `url && key`, so unset vars fold that to null and drop ~57 kB gz the
      # real build carries. Placeholders are enough; nothing dials them.
      - run: pnpm exec vite build
        env:
          VITE_HOST_MODE: platform
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      - run: node scripts/check-critical-path.mjs

  # The desktop shell is ~2000 lines of URL policy whose whole job is REFUSING
  # things: a blob that is not really our origin, a scheme that is not a browser
  # scheme, a redirect that leaves the app, a config value that is secretly
  # another host. None of that has a runtime here — the suite runs against a
  # stub — and none of it fails a typecheck, a build, or the web suite when it
  # regresses. It just quietly starts allowing what it used to refuse.
  #
  # It needs no services and finishes in well under a second, so it is not
  # conditioned on paths: a `web/index.html` edit can break the window-chrome
  # contract that lives half in this suite, and that is exactly the change that
  # would not have matched a `desktop/**` filter.
  desktop-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # A commit, not the v6 tag: that tag still points at a release without
      # pnpm 12 support.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Reads the pin from `packageManager`, so CI runs the pnpm the lockfile
          # was written by without a second copy of the version to keep in sync.
          package_json_file: desktop/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  frontend-e2e:
    runs-on: ubuntu-latest
    # Bound a hung run instead of riding GitHub's 6h default timeout.
    timeout-minutes: 20
    # Official Playwright image ships the browser + system deps pre-installed,
    # pulled from MCR. This removes the `playwright install` download step,
    # whose post-download hang (Chromium fetch reaches 100% then stalls during
    # extraction / next-artifact fetch from cdn.playwright.dev) was hanging CI.
    # KEEP THIS TAG IN SYNC with the @playwright/test version resolved in
    # web/pnpm-lock.yaml (package.json uses a ^ range, so the lockfile is the
    # source of truth). A mismatch makes playwright test fail on a browser/
    # library version error.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # A commit, not the v6 tag: that tag still points at a release without
      # pnpm 12 support.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Reads the pin from `packageManager`, so CI runs the pnpm the lockfile
          # was written by without a second copy of the version to keep in sync.
          package_json_file: web/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
