info:
  name: Create Workspace
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/v1/workspaces"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-User-Id
      value: "{{user_id}}"
  body:
    type: json
    data: |-
      {
        "name": "My Workspace",
        "description": "Optional workspace description",
        "config": {}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0

tests:
  test1: |
    test("should return 201, or 409 when a workspace already has the name", function() {
      expect(res.status).to.be.oneOf([201, 409]);
    });
  test2: |
    test("response should name a workspace_id (the holder's on a 409)", function() {
      const workspace = res.status === 409 ? res.body.detail : res.body;
      expect(workspace.workspace_id).to.be.a("string");
    });
  test3: |
    test("a 409 should carry the workspace_name_taken code", function() {
      if (res.status === 409) {
        expect(res.body.detail.code).to.equal("workspace_name_taken");
      }
    });
  test4: |
    test("a created workspace should have user_id, name and status", function() {
      if (res.status === 201) {
        expect(res.body.user_id).to.be.a("string");
        expect(res.body.name).to.be.a("string");
        expect(res.body.status).to.be.a("string");
      }
    });
  test5: |
    test("should set workspace_id variable", function() {
      const workspace = res.status === 409 ? res.body.detail : res.body;
      if (workspace && workspace.workspace_id) {
        bru.setEnvVar("workspace_id", workspace.workspace_id);
      }
    });

docs: |
  Create a new workspace with dedicated sandbox.

  This creates a new Daytona sandbox for the workspace. The operation
  may take 30-60 seconds as the sandbox needs to be initialized.

  **Headers:**
  - `X-User-Id` (required): User ID for workspace ownership

  **Request Body:**
  - `name` (required): Workspace name, 1-80 characters. Unique per user,
    compared case-insensitively on the folder it names: the workspace's
    folder on its computer is its name, so two names that make the same
    folder are the same name.
  - `description` (optional): Workspace description (max 1000 characters)
  - `config` (optional): Configuration settings object

  **Response Fields:**
  - `workspace_id`: Unique workspace identifier (UUID)
  - `user_id`: Owner user ID
  - `name`: Workspace name
  - `description`: Workspace description
  - `sandbox_id`: Daytona sandbox ID (may be null initially)
  - `dir_name`: The workspace's folder on its computer, its name in folder form
  - `previous_dir_names`: Folders a rename moved the workspace out of, newest
    first (empty for a new workspace)
  - `status`: Workspace status (creating, running, stopped, error, deleted)
  - `created_at`: Creation timestamp
  - `updated_at`: Last update timestamp
  - `last_activity_at`: Last agent activity timestamp
  - `stopped_at`: When workspace was stopped
  - `config`: Configuration settings

  **Error Responses:**
  - 400 `workspace_name_invalid`: The name is reserved or has no usable folder
    spelling. `{"detail": {"code": "workspace_name_invalid", "message": "..."}}`
  - 409 `workspace_name_taken`: Another of the user's workspaces has the name.
    `{"detail": {"code": "workspace_name_taken", "message": "...", "name": "...", "workspace_id": "..."}}`,
    where `workspace_id` is the workspace holding it.
  - 422: Request validation failed (name empty or longer than 80 characters)
  - 500: Failed to create workspace
