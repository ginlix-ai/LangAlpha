# =============================================================================
# AGENT CONFIGURATION
# =============================================================================
# This file contains agent capabilities and tool settings.
# Credentials should be stored in .env file.
# For non agent related config, see config.yaml

llm:
  # Model name from src/llms/manifest/models.json
  name: "claude-opus-5-5"
  background: "claude-sonnet-5-5"
  compaction: "" # blank → the model the turn runs
  fetch: ""         # blank → the background model
  fallback:
    - "deepseek-flash"
    - "glm-5.2"

sandbox:
  # Provider selection: "daytona" or "e2b" (cloud), or "docker" (local).
  # - daytona: Cloud-hosted sandboxes via Daytona API. Each workspace gets an isolated
  #   VM with auto-stop/archive/delete lifecycle. Snapshots are versioned by a hash of
  #   this config (working_dir, Python version, dependencies, apt packages).
  # - e2b: Cloud-hosted sandboxes via E2B API. Stop pauses the sandbox (memory and disk
  #   kept) and start resumes it in about a second. Each resource tier has its own
  #   template, built from the same image recipe as the Daytona snapshot.
  # - docker: Local Docker containers using Dockerfile.sandbox. Useful for development.
  # Override at runtime with SANDBOX_PROVIDER env var.
  provider: "daytona"
  # Other providers a user may pick when creating a computer; `provider` stays
  # the default. Each needs its credentials, and a computer keeps its provider.
  # "ssh" is offered only this way: it lets users add their own Linux or macOS machine.
  # offered_providers: ["e2b", "ssh"]

  # Daytona cloud sandbox configuration
  daytona:
    base_url: "https://app.daytona.io/api"
    auto_stop_interval: 3600 # 1 hour in seconds
    auto_archive_interval: 604800 # 7 days in seconds — keep workspaces "stopped" (fast restart) longer before moving to cold storage
    auto_delete_interval: 7776000 # 90 days in seconds — total lifetime before a dormant sandbox is garbage-collected
    host_unavailable_rebuild_after_minutes: 60 # rebuild a computer from its backup once its sandbox's host has refused starts this long (the old sandbox is kept); 0 always waits
    python_version: "3.12"

    # Hash will be automatically appended based on dependencies
    snapshot_enabled: true # Recommended: Enable snapshot-based sandbox creation
    snapshot_name: "langalpha" # Base name for snapshot (hash will be appended)
    snapshot_auto_create: true # build a tier's snapshot on first use if missing (takes minutes); false requires `make daytona-snapshots`

  # E2B cloud sandbox configuration. Needs E2B_API_KEY; archive is not
  # supported on this provider.
  e2b:
    auto_stop_interval: 3600 # seconds idle before the sandbox pauses
    max_timeout: 3600 # longest continuous run your plan allows (Hobby 3600, Pro 86400); caps every timeout
    template_name: "langalpha" # prefix of the per-tier templates: <template_name>-<tier>-<hash>
    template_auto_create: true # build a tier's template on first use if missing (takes minutes); false requires `make e2b-templates`
    # false makes ports answer only the preview proxy (needs PREVIEW_PROXY_BASE_URL).
    # A computer keeps the value it was created with, so turning this back on
    # still needs the proxy until the computers created while it was off are gone.
    public_traffic: true

  # A machine the user brings, reached over SSH (offer it with
  # offered_providers). Each user gets one client key, which they authorize on
  # their machine; the host, login and pinned host key are set per computer
  # when the user adds it, never here. Needs BYOK_ENCRYPTION_KEY, which keeps
  # the client keys encrypted at rest, and PREVIEW_PROXY_BASE_URL, since a
  # preview of a port on the machine is served through the preview proxy.
  # The agent runs as the login user in a folder of its own, ~/langalpha unless
  # the user picks another (filesystem.working_directory applies to hosted
  # computers only), with a Python runtime it installs under ~/.langalpha on
  # the first start. Nothing this deployment holds (MCP server keys, platform
  # secrets) is sent to the machine, only the computer's own data token, so a
  # built-in server that needs a vendor key works there when it is served over
  # HTTP with `auth: data_token`, and not over stdio. Removing the computer
  # takes those credentials off the machine; the folder stays the owner's.
  ssh:
    auto_stop_interval: 3600 # seconds idle before the computer's processes are stopped; the machine keeps running
    allow_private_addresses: false # true lets users add machines at private, loopback or link-local addresses
    # true sends SSH machines what any computer gets from this server: the
    # built-in data servers' keys (FMP_API_KEY and the rest) and the GitHub
    # bot token. Each machine's owner can read them, so turn it on only where
    # every user may hold them, such as a deployment you alone use. Machines
    # added earlier pick the change up at their next start. A deployment with
    # a platform_secrets catalog refuses to boot with it on.
    trusted_host: false
    # SSH connections per user per hour to addresses the user names (a probe,
    # a pairing, a create); starting a computer is not counted. 0 is no limit.
    dials_per_hour: 60
    # Addresses this server's SSH connections come from, as the machines see
    # them (IPs or CIDR). Set, each machine's key line admits logins only from
    # these and from the machine itself (its tunnel), and every start brings
    # the line up to date. Empty admits any address. List a new address
    # beside the old one until the machines have started once from it.
    login_from: []
    connect_timeout: 10 # seconds
    keepalive_interval: 15 # seconds between keepalives on the pooled connection
    keepalive_count_max: 3 # unanswered keepalives before the connection is dropped
    bootstrap_timeout: 1800 # seconds the first start may spend installing the runtime
    max_computers_per_user: 20 # SSH computers one user may have; 0 for no limit

  # Platform-secret catalog: Daytona and E2B providers (ignored under
  # docker/memory). Each entry delivers a backend-owned API key into sandboxes
  # as a managed Secret: the sandbox env var holds an opaque placeholder, and
  # the provider puts the real value into outbound HTTPS request *headers* for
  # the allowlisted hosts only. Daytona substitutes the placeholder in any
  # header; E2B sets the one `header` the entry names. Declared per deployment
  # (not code); an entry is the opt-in and works in OSS mode too. Uncomment the
  # FMP example to enable. Boot then fail-closes unless the provider's
  # namespace (DAYTONA_SECRET_NAMESPACE or E2B_SECRET_NAMESPACE) and the source
  # env var are set. With HOST_MODE=platform the catalog may be empty: a
  # built-in server env var named like a credential (*_API_KEY, *_SECRET,
  # *_TOKEN, ...) with no entry is withheld from sandboxes, never plaintext.
  # platform_secrets:
  #   - source_env_var: "FMP_API_KEY"        # read from the host .env
  #     sandbox_env_var: "FMP_API_KEY"       # placeholder-bearing var in the sandbox
  #     name_suffix: "platform-fmp-api-key"  # Secret name = <namespace>-<suffix>
  #     description: "Platform FMP API key"
  #     hosts: ["financialmodelingprep.com"] # egress substitution allowlist
  #     header: "apikey"                     # header that carries the key; E2B requires it

  # Docker local sandbox configuration
  # Ignored when provider is "daytona" or "e2b". Override with DOCKER_SANDBOX_* env vars.
  docker:
    image: "langalpha-sandbox:latest" # Build with: docker build -f Dockerfile.sandbox -t langalpha-sandbox:latest .
    memory_limit: "4g"
    cpu_count: 2.0
    network_mode: "bridge" # "bridge" (default) or "none" for full isolation
    dev_mode: false # true = bind-mount host dir (fast local dev, files shared instantly)
    # host_work_dir: "/tmp/langalpha-sandbox-work"  # Required when dev_mode is true
    # volumes:  # Extra mounts in "host:container[:ro]" format
    #   - "/data/datasets:/mnt/datasets:ro"

mcp:
  # The servers that ship with LangAlpha are declared by the bundles under
  # plugins/, one Agent Plugins package per group -- see plugins/README.md.
  # This list is yours: servers you add, and overrides for the ones we ship.
  #
  # A name no bundle declares ADDS a server. A name a bundle already declares
  # OVERRIDES it -- the keys you write here are laid over the shipped server
  # and every key you leave out keeps its shipped value. Switching one off is
  # two lines, and changing one field never means restating the command:
  #
  #   - name: "price_data"          # stop launching a server we ship
  #     enabled: false
  #
  #   - name: "yf_price"            # keep ours, show the agent every tool
  #     tool_exposure_mode: "detailed"
  #
  #   - name: "fundamentals"        # keep our description, run your own build
  #     command: "uvx"
  #     args: ["--from", "my-fundamentals-mcp", "serve"]
  #
  # Overriding here rather than editing plugins/ keeps your choice out of a
  # file the next pull overwrites. `env` and `headers` replace the shipped map
  # whole rather than merging key by key, so you can take a variable away as
  # well as add one.
  #
  # Third-party stdio servers: always launch isolated -- uvx/npx with pinned
  # versions -- never from the shared environment, whose dependency pins
  # (including the mcp SDK) will strand them on the next SDK major. Builtin
  # servers under plugins/ are era-proof via _bootstrap and run with
  # `uv run python`.
  servers:
    # A no-op override, here so the shape is in front of you. Flip it to
    # false and price_data stops launching on the next restart.
    - name: "price_data"
      enabled: true

    # Adding a server of your own looks like this:
    # - name: "tavily"
    #   description: "Web search engine for finding current information online"
    #   instruction: "Use for web searches, news, research, and real-time information."
    #   tool_exposure_mode: "summary"
    #   transport: "stdio"
    #   command: "npx"
    #   args: ["-y", "tavily-mcp@latest"]
    #   env:
    #     TAVILY_API_KEY: "${TAVILY_API_KEY}"

  # Tool discovery settings
  tool_discovery_enabled: true
  lazy_load: true # Load tools on-demand
  cache_duration: 300 # Cache tool metadata for 5 minutes

filesystem:
  # Filesystem access configuration for first-class filesystem tools.
  # These tools provide direct file and directory operations without code generation.

  # Working directory inside the sandbox — the root for all agent file operations.
  # Agent sees virtual paths like /results/file.txt which map to {working_directory}/results/file.txt.
  # Must match the home directory of the sandbox user (created in Dockerfile.sandbox).
  # Changing this value triggers automatic workspace migration: existing workspaces will
  # back up files to PostgreSQL and recreate their sandbox with the new working directory
  # on next reconnect (tracked via sandbox_config_hash in workspaces.config JSONB).
  working_directory: "/home/workspace"

  # allowed_directories and denied_directories are auto-derived from working_directory:
  #   allowed: [working_directory, "/tmp"]
  #   denied:  [working_directory/_internal]
  # Override only if you need custom values.

  enable_path_validation: true # Validate paths against allowed_directories

storage:
  # Cloud storage provider for image/chart/file uploads and avator
  # All credentials and settings are loaded from .env file
  # Options: s3, r2, oss, none (to disable uploads)
  provider: "s3"

logging:
  # Logging configuration
  level: "INFO" # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "logs/ptc.log"

agent:
  background_auto_wait: false

# Subagent configuration
subagents:
  # List of enabled subagents (available: research, general-purpose, data-prep, equity-analyst, report-builder, plus user-defined)
  enabled:
    - general-purpose
    - research
    - data-prep
    - equity-analyst
    - report-builder

  # User-defined subagents (optional). Each key becomes a subagent name.
  # definitions:
  #   equity-analyst:
  #     description: "Specialized equity research analyst for deep-dive company analysis"
  #     role_prompt: |
  #       You are a senior equity research analyst...
  #     tools: [execute_code, filesystem, finance, web_search]
  #     skills: [automation]                   # Runtime-loaded via SkillsMiddleware
  #     preload_skills: [creating-financial-models, xlsx]  # Injected into prompt
  #     sections:
  #       workspace_paths: true
  #       tool_guide: true
  #       data_processing: true
  #       visualizations: true

# Compaction Middleware Configuration
# Automatically compacts conversation context when approaching token limits
compaction:
  enabled: true # Enable/disable context compaction
  token_threshold: 120000 # Trigger full compaction when messages exceed this token count
  keep_tokens: 20000 # Newest history a summary keeps word for word, in the model's tokens
  claude_keep_tokens: 32000 # The same for Claude, whose tokens hold about 1.6x less text
  # A model whose provider does not compact the conversation writes its own
  # summary from its cached request. The summary model reading the transcript
  # is the fallback, and writes it instead when a separate compaction model is
  # picked. false: always the transcript summarizer.
  self_summary: true
  # Tier 1: when a turn starts this many minutes after the model's last
  # response (the prompt cache is meant to be cold by then), hide large tool
  # args and stale Read results in older messages. Off (null) by default: what
  # it saves is negligible, and on Claude it invalidates the preserved
  # thinking after what it hides.
  truncate_args_idle_minutes: null
  truncate_args_keep_messages: 10 # Protect last N messages from Tier 1
  truncate_args_max_length: 2000 # Per-arg-value max chars before truncation

# =============================================================================
# TOOL CONFIGURATION
# =============================================================================

# Search API Configuration
# Options: tavily, bocha, serper, exa, parallel
search_api: tavily

# Crawler Configuration
# Web crawling with SafeCrawlerWrapper for circuit breaker and fault tolerance.
# Backend: "scrapling" uses tiered HTTP→browser→stealth fetching.
crawler:
  backend: "router" # Options: "scrapling", "router" (adds PDF/YouTube/X extraction)
  # Stage-level concurrency caps (replace the old max_concurrent_crawls).
  # Tier 1 (curl_cffi) is cheap, Tier 2/3 (browsers) bound RAM at ~400MB each.
  http_concurrency: 20    # Max concurrent Tier-1 HTTP fetches
  browser_concurrency: 6  # Max concurrent Tier-2/3 browser fetches (~2.4GB RAM ceiling)
  page_timeout: 60000 # Page load timeout in ms (overall, all tiers)

  # Circuit breaker settings — applied to both per-host and global infra breakers.
  # Per-host: a failing Reuters cannot poison Wikipedia.
  # Global infra: trips on cross-cutting failures (browser crash, DNS).
  circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 60
    success_threshold: 2

  # Queue limit — admission-control counter. Returns queue_full immediately when
  # in-flight exceeds max_size; no separate slot wait.
  queue:
    max_size: 100

# Web Fetch Configuration
# Settings for web_fetch tool's sitemap-aware content extraction
web_fetch:
  sitemap_enabled: true # Sitemap fetching for URL suggestions
  sitemap_max_urls: 100 # Max URLs to fetch from sitemap
  sitemap_max_examples: 3 # Max example URLs per path prefix in summary
  sitemap_timeout: 10 # Timeout in seconds for sitemap fetch
